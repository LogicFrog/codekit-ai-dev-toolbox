spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  datasource:
    url: jdbc:h2:file:${user.home}/.codekit/data/codekit;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 18080

ai:
  provider: real
  settings:
    store-file: ${user.home}/.codekit/data/ai-settings.json
  session:
    store-file: ${user.home}/.codekit/data/ai-sessions.json
